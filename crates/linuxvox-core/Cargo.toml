[package]
name = "linuxvox-core"
version = "0.1.0"
edition = "2021"
authors = ["Jack", "Esperanza"]
description = "Headless, high-performance voxel engine, mesher, raycaster, and .vox file I/O for EsperaVox"
license = "MIT OR Apache-2.0"

[dependencies]
glam = "0.29"
byteorder = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.10"
